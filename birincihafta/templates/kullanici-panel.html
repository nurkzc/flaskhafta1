<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kullanıcı Paneli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-gray-800">
  <div class="container py-5">
    <div class="text-center mb-4">
      <h1 class="text-3xl font-bold text-amber-800">Kullanıcı Paneli</h1>
    </div>
    <div class="row g-3">
      <div class="col-md-4">
        <div class="p-4 bg-white rounded-3 shadow-sm border border-amber-200">
          <h4 class="text-lg font-semibold text-amber-700">Profilim</h4>
          <p class="text-sm mt-2">Kullanıcı bilgilerinizi görüntüleyin ve güncelleyin.</p>
          <a href="/dashboard" class="btn btn-warning mt-3 w-100">Güncelle</a>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-4 bg-white rounded-3 shadow-sm border border-amber-200">
          <h4 class="text-lg font-semibold text-amber-700">Taleplerim</h4>
          <p class="text-sm mt-2">Daha önce oluşturduğunuz destek taleplerini inceleyin.</p>
          <a href="/admin-panel" class="btn btn-warning mt-3 w-100">Talepleri Gör</a>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-4 bg-white rounded-3 shadow-sm border border-amber-200">
          <h4 class="text-lg font-semibold text-amber-700">Yeni Talep Oluştur</h4>
          <p class="text-sm mt-2">Yeni bir destek talebi açın.</p>
          <a href="/create" class="btn btn-warning mt-3 w-100">Yeni Talep</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
