<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kullanıcı Paneli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --main-bg: #fff0f6;
      --accent: #f472b6;
      --accent-dark: #be185d;
    }
    body {
      background-color: var(--main-bg);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg" style="background-color: var(--accent-dark);">
    <div class="container">
      <a class="navbar-brand text-white" href="/">Destek Sistemi</a>
      <div class="ms-auto">
        <a class="btn btn-light" href="/">Çıkış Yap</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="text-center text-pink-700 mb-4">Hoş Geldiniz, Kullanıcı</h2>
    
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card shadow rounded-4">
          <div class="card-body text-center">
            <h5 class="card-title text-pink-700">Toplam Talepler</h5>
            <p class="fs-2">12</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow rounded-4">
          <div class="card-body text-center">
            <h5 class="card-title text-pink-700">Cevaplanan</h5>
            <p class="fs-2">8</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow rounded-4">
          <div class="card-body text-center">
            <h5 class="card-title text-pink-700">Olumlu Geri Bildirim</h5>
            <p class="fs-2">6</p>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-5">
      <a href="/create" class="btn btn-lg" style="background-color: var(--accent); color: white;">Yeni Talep Oluştur</a>
    </div>
  </div>

  <footer class="text-center py-4 mt-5" style="background-color: var(--accent-dark); color: white;">
    &copy; 2025 Destek Talep Sistemi
  </footer>
</body>
</html>
