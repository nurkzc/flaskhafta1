<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kayıt Ol</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --main-bg: #fdf2f8;
      --accent: #e879f9;
      --accent-dark: #c026d3;
    }
    body {
      background-color: var(--main-bg);
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg" style="background-color: var(--accent-dark);">
    <div class="container">
      <a class="navbar-brand text-white" href="/">Destek Sistemi</a>
      <div class="ms-auto">
        <a class="btn btn-light" href="/login">Giriş Yap</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="text-center text-purple-700 mb-4">Hesap Oluştur</h2>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <form>
          <div class="mb-3">
            <label for="username" class="form-label">Kullanıcı Adı</label>
            <input type="text" class="form-control" id="username" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-posta</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Şifre</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <a href="/login" class="btn btn-primary w-100" style="background-color: var(--accent-dark); border: none;">Kayıt Ol</a>
        </form>
        <p class="mt-3 text-center">Zaten hesabın var mı? <a href="/login" class="text-decoration-none text-purple-700">Giriş yap</a></p>
      </div>
    </div>
  </div>

  <footer class="text-center py-4" style="background-color: var(--accent-dark); color: white;">
    &copy; 2025 Destek Talep Sistemi
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
