<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destek Talebi Düzenle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>:root { --main: #fdf4ff; --accent: #e879f9; --dark: #701a75; } body { background: var(--main); }</style>
</head>
<body>
  <nav class="navbar navbar-expand-lg" style="background-color: var(--dark);">
    <div class="container">
      <a class="navbar-brand text-white" href="/">Destek Sistemi</a>
      <div class="ms-auto">
        <a class="btn btn-light" href="/login">Giriş Yap</a>
        <a class="btn btn-outline-light" href="/register">Kayıt Ol</a>
      </div>
    </div>
  </nav>
  <div class="container py-5">
    <h1 class="text-center text-purple-700 mb-4">Destek Talebini Düzenle</h1>
    <form>
      <div class="mb-3">
        <label for="title" class="form-label">Talep Başlığı</label>
        <input type="text" class="form-control" id="title" value="Başlık" required />
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Açıklama</label>
        <textarea class="form-control" id="description" rows="4" required>İçerik</textarea>
      </div>
      <button type="submit" class="btn btn-pink">Güncelle</button>
    </form>
  </div>
  <footer class="text-center py-3 mt-5" style="background-color: var(--dark); color: white;">&copy; 2025 Destek Sistemi</footer>
</body>
</html>
