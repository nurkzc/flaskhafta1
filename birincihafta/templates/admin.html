<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>:root { --main: #fdf4ff; --accent: #e879f9; --dark: #701a75; } body { background: var(--main); }</style>
</head>
<body>
  <nav class="navbar navbar-expand-lg" style="background-color: var(--dark);">
    <div class="container">
      <a class="navbar-brand text-white" href="/">Destek Sistemi</a>
      <div class="ms-auto">
        <a class="btn btn-light" href="/login">Giriş Yap</a>
        <a class="btn btn-outline-light" href="/register">Kayıt Ol</a>
      </div>
    </div>
  </nav>
  <div class="container py-5">
    <h1 class="text-center text-purple-700 mb-4">Admin Panel</h1>
    <p class="text-center">Admin olarak talep yönetimini buradan yapabilirsiniz.</p>
    <div class="row mt-5">
      <div class="col-md-4"><div class="p-4 shadow rounded-3 bg-white"><h5>Toplam Talep</h5><p class="fs-3 text-pink-600">28</p></div></div>
      <div class="col-md-4"><div class="p-4 shadow rounded-3 bg-white"><h5>Olumlu Yanıtlar</h5><p class="fs-3 text-pink-600">19</p></div></div>
      <div class="col-md-4"><div class="p-4 shadow rounded-3 bg-white"><h5>Bekleyen Talepler</h5><p class="fs-3 text-pink-600">7</p></div></div>
    </div>
  </div>
  <footer class="text-center py-3 mt-5" style="background-color: var(--dark); color: white;">&copy; 2025 Destek Sistemi</footer>
</body>
</html>
